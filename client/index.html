<!DOCTYPE html>
<html lang="id" class="antialiased">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JasaOTP - Dashboard Premium</title>
  <meta name="description" content="Dashboard premium untuk membeli nomor virtual dan OTP" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/app.css" />
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-['Inter'] min-h-screen transition-colors duration-200">

  <!-- Loading Screen -->
  <div id="loading-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-gray-50 dark:bg-gray-950 transition-opacity duration-500">
    <div class="text-center">
      <div class="relative mx-auto mb-6 w-16 h-16">
        <div class="absolute inset-0 rounded-full border-4 border-indigo-100 dark:border-indigo-900/50"></div>
        <div class="absolute inset-0 rounded-full border-4 border-transparent border-t-indigo-600 animate-spin"></div>
      </div>
      <h1 class="text-2xl font-bold text-gray-800 dark:text-white">JasaOTP</h1>
      <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">Memuat dashboard...</p>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-[90] flex flex-col gap-2 max-w-sm w-full pointer-events-none"></div>

  <!-- Modal Container -->
  <div id="modal-container" class="fixed inset-0 z-[80] hidden">
    <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"></div>
    <div class="relative z-10 flex items-center justify-center min-h-screen p-4">
      <div id="modal-content" class="bg-white dark:bg-gray-900 rounded-2xl shadow-2xl w-full max-w-md p-6 border border-gray-200 dark:border-gray-800 transform transition-all duration-200"></div>
    </div>
  </div>

  <!-- App Layout -->
  <div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 w-64 bg-white dark:bg-gray-900 border-r border-gray-200 dark:border-gray-800 transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out flex flex-col">
      <!-- Sidebar Header -->
      <div class="flex items-center gap-3 px-6 h-16 border-b border-gray-200 dark:border-gray-800 shrink-0">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-600 to-violet-600 flex items-center justify-center text-white font-bold text-sm shadow-lg shadow-indigo-500/20">J</div>
        <span class="font-semibold text-lg text-gray-900 dark:text-white">JasaOTP</span>
      </div>

      <!-- Sidebar Nav -->
      <nav class="flex-1 overflow-y-auto py-4 px-3 space-y-1">
        <a href="#" data-page="dashboard" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white">
          <i data-lucide="layout-dashboard" class="w-5 h-5 shrink-0"></i>
          <span>Dashboard</span>
        </a>
        <a href="#" data-page="buy" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white">
          <i data-lucide="shopping-cart" class="w-5 h-5 shrink-0"></i>
          <span>Beli Nokos</span>
        </a>
        <a href="#" data-page="otp" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white">
          <i data-lucide="message-square-text" class="w-5 h-5 shrink-0"></i>
          <span>OTP Aktif</span>
        </a>
        <a href="#" data-page="history" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white">
          <i data-lucide="clock" class="w-5 h-5 shrink-0"></i>
          <span>Riwayat</span>
        </a>
        <a href="#" data-page="settings" class="sidebar-link flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 hover:text-gray-900 dark:hover:text-white">
          <i data-lucide="settings" class="w-5 h-5 shrink-0"></i>
          <span>Pengaturan</span>
        </a>
      </nav>

      <!-- Sidebar Footer -->
      <div class="px-3 py-4 border-t border-gray-200 dark:border-gray-800">
        <div class="px-3 py-2 text-xs text-gray-400 dark:text-gray-500">
          &copy; 2025 JasaOTP Dashboard
        </div>
      </div>
    </aside>

    <!-- Sidebar Overlay (mobile) -->
    <div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col lg:pl-64 min-w-0">
      <!-- Navbar -->
      <header class="sticky top-0 z-30 bg-white/80 dark:bg-gray-900/80 backdrop-blur-xl border-b border-gray-200 dark:border-gray-800">
        <div class="flex items-center justify-between h-16 px-4 lg:px-6">
          <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" class="lg:hidden p-2 -ml-2 rounded-lg text-gray-600 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors">
              <i data-lucide="menu" class="w-5 h-5"></i>
            </button>
            <h1 id="page-title" class="text-lg font-semibold text-gray-900 dark:text-white">Dashboard</h1>
          </div>
          <div class="flex items-center gap-3">
            <div id="balance-badge" class="hidden md:flex items-center gap-2 px-3 py-1.5 bg-emerald-50 dark:bg-emerald-900/20 text-emerald-700 dark:text-emerald-400 rounded-full text-sm font-medium">
              <i data-lucide="wallet" class="w-4 h-4"></i>
              <span id="balance-display">Rp 0</span>
            </div>
            <button onclick="App.refresh()" class="p-2 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" title="Refresh">
              <i id="refresh-icon" data-lucide="refresh-cw" class="w-5 h-5"></i>
            </button>
            <button onclick="toggleDarkMode()" class="p-2 rounded-lg text-gray-500 dark:text-gray-400 hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" title="Toggle Dark Mode">
              <i id="theme-icon" data-lucide="moon" class="w-5 h-5"></i>
            </button>
          </div>
        </div>
      </header>

      <!-- Page Content -->
      <main id="main-content" class="flex-1 overflow-y-auto p-4 lg:p-6">
        <div id="page-content" class="max-w-7xl mx-auto">
          <!-- Dynamic content rendered here -->
        </div>
      </main>
    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/components.js"></script>
  <script src="/js/pages/dashboard.js"></script>
  <script src="/js/pages/buy.js"></script>
  <script src="/js/pages/otp.js"></script>
  <script src="/js/pages/history.js"></script>
  <script src="/js/pages/settings.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
